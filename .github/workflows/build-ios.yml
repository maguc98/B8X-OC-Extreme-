name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Config/**"
      - "Package.swift"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run protocol unit tests
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project B8XOC.xcodeproj \
            -scheme B8XOC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/B8XOC.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          test -x "$APP_PATH/B8XOC"
          plutil -lint "$APP_PATH/Info.plist"
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry B8X-OC-Extreme-unsigned.ipa Payload
          unzip -tq B8X-OC-Extreme-unsigned.ipa
          unzip -l B8X-OC-Extreme-unsigned.ipa | grep -F "Payload/B8XOC.app/Info.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: B8X-OC-Extreme-unsigned-IPA
          path: build/B8X-OC-Extreme-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
