name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run protocol unit tests
        run: |
          xcodebuild test \
            -project B8XOC.xcodeproj \
            -scheme B8XOC \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project B8XOC.xcodeproj \
            -scheme B8XOC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/B8XOC.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry B8X-OC-Extreme-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: B8X-OC-Extreme-unsigned-IPA
          path: build/B8X-OC-Extreme-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
