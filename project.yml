name: B8XOC
options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  B8XOC:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "B8X OC"
        NSBluetoothAlwaysUsageDescription: "用于搜索并连接飞智 B8X 散热器。"
        UIUserInterfaceStyle: Automatic
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ExtendedGamepad
          - Gamepad
          - MicroGamepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.b8xoc
        PRODUCT_NAME: B8XOC
        CODE_SIGN_STYLE: Manual
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
